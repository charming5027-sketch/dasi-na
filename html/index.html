<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다시, 나 - 경력 포트폴리오</title>

  <!-- Google Fonts: Noto Sans KR 연결 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- 외부 스타일시트 연결 -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- 상단 영역: 로고 및 내비게이션 -->
  <header>
    <h1>다시, 나</h1>
    <nav>
      <ul>
        <li><a href="#about">소개</a></li>
        <li><a href="#experience">경력</a></li>
        <li><a href="#skills">역량</a></li>
        <li><a href="#education">교육·자격</a></li>
        <li><a href="#contact">문의</a></li>
      </ul>
    </nav>
  </header>

  <!-- 본문 영역 -->
  <main>
    <!-- 소개 섹션 -->
    <section id="about">
      <h2>소개</h2>
      <img src="https://placehold.co/300x300?text=Profile" alt="김지은 프로필 사진" width="300" height="300">
      <h3>김지은</h3>
      <p>10년 경력의 사무행정 전문가, 다시 시작합니다</p>
    </section>

    <!-- 경력 섹션 -->
    <section id="experience">
      <h2>경력</h2>
      <img src="https://placehold.co/600x200?text=Career" alt="경력 대표 이미지" width="600" height="200">
      <p>주요 경력 사항이 들어갈 자리입니다.</p>
    </section>

    <!-- 역량 섹션 -->
    <section id="skills">
      <h2>역량</h2>
      <img src="https://placehold.co/600x200?text=Skills" alt="역량 대표 이미지" width="600" height="200">
      <p>보유 핵심 역량 및 업무 스킬이 들어갈 자리입니다.</p>
    </section>

    <!-- 교육·자격 섹션 -->
    <section id="education">
      <h2>교육·자격</h2>
      <img src="https://placehold.co/600x200?text=Education" alt="교육 및 자격 이미지" width="600" height="200">
      <p>수료 교육 및 취득 자격증 정보가 들어갈 자리입니다.</p>
    </section>

    <!-- 문의 섹션 -->
    <section id="contact">
      <h2>문의</h2>
      <img src="https://placehold.co/600x150?text=Contact" alt="문의 안내 이미지" width="600" height="150">
      <p>연락처 및 문의 수단이 들어갈 자리입니다.</p>
    </section>
  </main>

  <!-- 하단 푸터 영역 -->
  <footer>
    <p>&copy; 2026 김지은. All rights reserved.</p>
  </footer>

  <!-- 외부 자바스크립트 연결 -->
  <script src="/js/script.js"></script>
</body>
</html>
